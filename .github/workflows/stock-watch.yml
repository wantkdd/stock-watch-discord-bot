name: Korean Stock Watch Discord Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: morning or watch
        required: true
        default: watch
        type: choice
        options:
          - morning
          - watch
  schedule:
    # 08:43 KST Mon-Fri = 23:43 UTC Sun-Thu: LLM morning review.
    # Avoid exact :00/:05/:40 slots because GitHub scheduled workflows can be delayed under load.
    - cron: '43 23 * * 0-4'
    # 09:07, 09:17, hourly at :17, and 15:27 KST Mon-Fri.
    - cron: '7 0 * * 1-5'
    - cron: '17 0 * * 1-5'
    - cron: '17 1 * * 1-5'
    - cron: '17 2 * * 1-5'
    - cron: '17 3 * * 1-5'
    - cron: '17 4 * * 1-5'
    - cron: '17 5 * * 1-5'
    - cron: '17 6 * * 1-5'
    - cron: '27 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide run mode
        id: mode
        shell: bash
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [[ -z "$mode" ]]; then
            if [[ "${{ github.event.schedule }}" == "43 23 * * 0-4" || "${{ github.event.schedule }}" == "40 23 * * 0-4" ]]; then
              mode="morning"
            else
              mode="watch"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Run stock watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/cloud_stock_watch.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit generated morning overlay/report
        if: steps.mode.outputs.mode == 'morning'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/morning-overlay.json data/morning-review-*.md || true
          if git diff --cached --quiet; then
            echo "No morning changes to commit"
          else
            git commit -m "Update morning stock watch overlay"
            git push
          fi
