name: Korean Stock Watch Discord Bot

on:
  workflow_dispatch:
  schedule:
    # Korean regular session watch: hourly from 09:00 to 15:00 KST.
    # Each alert includes the current price checklist plus Gemini overall review when configured.
    - cron: '0 0-6 * * 1-5'

permissions:
  contents: read

concurrency:
  group: stock-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/cloud_stock_watch.py --mode watch
